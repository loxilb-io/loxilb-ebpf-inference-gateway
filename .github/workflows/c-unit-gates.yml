name: C-Unit-Gates

# The standalone C units for the sockproxy auth plane, gated where the code
# lives. Until now these targets ran only from the gateway repo's CI against
# its PINNED submodule revision, so a unit added or changed HERE was not
# exercised anywhere until the pin moved — a test that exists but is run by
# nobody. This workflow closes that gap: every push and PR to this repo runs
# the units at the revision under review, no gateway checkout involved.
#
# Scope: the self-contained targets only (compile from common/ sources plus
# system libraries; no datapath build, no kernel objects). Heavier units that
# need the full proxy object graph stay with the gateway repo's build.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'common/**'
      - '.github/workflows/c-unit-gates.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'common/**'
      - '.github/workflows/c-unit-gates.yml'
  workflow_dispatch:

jobs:
  c-units:
    name: c-units
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain and unit dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential libnghttp2-dev libssl-dev

      - name: Host, listener identity, model and path routing
        run: |
          make -C common test_model_routing
          ./common/test_model_routing
          gcc -Wall -Wextra -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o /tmp/test_model_routing_sanitized common/test_model_routing.c \
            common/sockproxy_routing.c common/sockproxy_pool.c common/sockproxy_qsbr.c \
            common/sockproxy_fc.c common/log.c -Icommon -lpthread
          ASAN_OPTIONS=detect_leaks=1 /tmp/test_model_routing_sanitized

      # The runner kernel's 32-bit mmap randomisation leaves no room for
      # ThreadSanitizer's shadow layout ("unexpected memory mapping").
      - name: Pool lifetime (holders, grace period, index, permits; ASan + UBSan and TSan)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make -C common test_poolref

      - name: An HTTP/2 stream gives its pool back on the real stream free (ASan + UBSan)
        run: make -C common test_h2rref

      - name: An HTTP/2 client connection's end records and logs why (ASan + UBSan)
        run: make -C common test_h2end

      - name: The header deadline charges only the block of the connection that armed it (ASan + UBSan and TSan)
        run: make -C common test_hdrdl

      - name: Parser settings shared by every connection are filled once (ASan + UBSan and TSan)
        run: make -C common test_ponce

      - name: One HTTP/2 backend leg ending answers only its own streams (ASan + UBSan)
        run: make -C common test_h2leg

      - name: Nothing reads an HTTP/2 stream after an answer that may have freed it (ASan + UBSan, gateway object included)
        run: make -C common test_h2deny

      - name: HTTP/2 request body outlives its client stream (ASan)
        run: make -C common test_h2body

      - name: A half-closed HTTP/2 client is never held (ASan + UBSan)
        run: make -C common test_h2hold

      - name: An endpoint force-close hands HTTP/2 connections to their worker (ASan + UBSan)
        run: make -C common test_forceclose

      - name: An L7 FORWARD route selects within the listener's pool (ASan + UBSan and TSan)
        run: make -C common test_l7route

      - name: Modern MCP validation, framing, relay and selection (sanitizers)
        run: make -C common test_mcp

      - name: Header-field guard (bytes between a header value and the wire)
        run: make -C common test_l7hdr

      - name: Per-direction sockmap gate (what a declaration owns, what still pairs)
        run: make -C common test_smgate

      - name: HTTP/2 upstream header hygiene
        run: make -C common test_aisec

      - name: Admission-gate identity transport and the keyless shared bucket
        run: make -C common test_aiident

      - name: Operational log (per-thread rings, one writer thread; a full ring never blocks the caller)
        run: make -C common test_log

      - name: A request's header block is edited once and a body read never (request framer state, header edits; ASan + UBSan)
        run: make -C common test_creq

      - name: The objective header's capture, the class headers of an admitted response, and a backend's X-Api-Key in its response head (real framers, ASan + UBSan)
        run: make -C common test_objhint

      - name: Capacity admission gate (ceilings, exactly-once release, role legs, observe/off) and its bounded queue (order, depth, cancel/deadline/drain exclusivity, resize)
        run: make -C common test_fc

      - name: Half-close observation (bucket edges, sampling gate, TLS end classification, User-Agent families)
        run: make -C common test_hc

      - name: Holding a half-closed client (gate, settle, end classification, idle bound, arming)
        run: make -C common test_hold

      - name: Every fd arming goes through sp_notify_arm (source invariant)
        run: make -C common check_notify_arm

      - name: A client kept open after its FIN has only its read side shut (source invariant)
        run: make -C common check_client_eof_keep

      - name: The correlation key that joins a request's records across its keep-alive reset
        run: make -C common test_ridjoin

      - name: Which forwarded hop a request is attributed to
        run: make -C common test_l7tr

      # Links the policy translation unit, so it also catches a header struct
      # whose fields moved out from under the request path.
      - name: What a listener puts on the wire, and the origin it records
        run: make -C common test_l7or

      # Built in both include orders: conversation_mapping_t embeds a
      # CONV_POOL_KEY_MAX array, so a key size that moved with include order
      # would give that struct two layouts with no compiler diagnostic.
      - name: Conversation stickiness names its pool, and a health signal names its endpoint
        run: make -C common test_conv

      - name: What the backend leg accepts from an endpoint, and what it presents
        run: make -C common test_betls

      - name: Whether a keep-alive request may ride the backend leg its predecessor used
        run: make -C common test_ka

      - name: UC-5 terminal admission framing (exact length, split input, overflow rejection)
        run: make -C common test_admit

      - name: UC-5 backend failure completion Audit (production sender, identity and once-only guards)
        run: make -C common test_backend_failure_audit

      - name: UC-5 unchanged L2 split horizon (all VLAN values, routing/NAT/tunnel exceptions)
        run: make -C common test_l2_reflection

      - name: Decode EOF taxonomy, bounded terminal framing and idle completion policy (ASan + UBSan)
        run: make -C common test_pd_terminal_failure
